onboarding:
  candidate:
    candidate_id: local-candidate
    target_roles:
      - Data Engineer
      - Data Scientist
      - AI Engineer
    skills:
      - Python
      - SQL
      - pandas
      - scikit-learn
    years_experience: 1
    preferred_work_modes:
      - remote
    minimum_salary: 65000
    facts:
      - key: work_authorized_us
        value: true
        evidence:
          - resume:general
        verified: true
        risk: high

  resume_evidence:
    candidate_id: local-candidate
    sources:
      - source_id: resume-general
        kind: document
        label: General technical resume
        locator: data/private/resumes/general.pdf
      - source_id: project-overview
        kind: document
        label: Project experience overview
        locator: data/private/project-overview.pdf

    items:
      - evidence_id: verified-data-project
        kind: project
        claim: Built a documented Python data preparation workflow.
        skills:
          - Python
          - pandas
          - data cleaning
        role_families:
          - data_engineering
          - analytics
        source_refs:
          - project-overview
        verified: true

    families:
      - family_id: data-engineering
        name: Data Engineering
        role_families:
          - data_engineering
        priority_skills:
          - Python
          - SQL
          - pandas
        pinned_evidence_ids:
          - verified-data-project

  resume_assets:
    - family_id: data-engineering
      label: Data Engineering resume
      file_path: data/private/resumes/data-engineering.pdf

  run_defaults:
    discovery:
      providers:
        - jobicy
        - adzuna
      limit_per_provider: 200
    candidate_pool: 1000
    max_jobs: 25
    evidence_limit: 6
    resume_minimum_confidence: 0.35
    fallback_family_id: data-engineering

search_profiles:
  - profile_id: remote-data-ai-65k
    candidate_id: local-candidate
    name: Remote Data / AI >=65k
    role_queries:
      - Data Engineer
      - Data Scientist
      - AI Engineer
    allowed_work_modes:
      - remote
    minimum_salary: 65000
    salary_currency: USD
    salary_floor_policy: minimum_offered
    unknown_compensation_policy: exclude
    active: true
