name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobops
          POSTGRES_USER: jobops
          POSTGRES_PASSWORD: jobops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobops -d jobops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBOPS_DATABASE_URL: postgresql+psycopg://jobops:jobops@localhost:5432/jobops
      JOBOPS_TEST_DATABASE_URL: postgresql+psycopg://jobops:jobops@localhost:5432/jobops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate test database
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=jobops --cov-report=term-missing
