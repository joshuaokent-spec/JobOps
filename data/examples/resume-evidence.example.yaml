    title: Local Data Lake ETL Prototype
    skills: [Python, SQL, ETL, Data Pipelines, Data Quality]
    role_families: [data_engineering, data_science, analytics]
    tags: [portfolio, pipeline, ingestion]
    metrics:
      - name: pipeline_stages
        value: 4
        unit: stages
        context: ingest, transform, validate, publish
    source_refs: [source-data-lake-repo, source-project-overview]
    verified: true

  - evidence_id: project-ml-ranking
    kind: project
    claim: Implemented an explainable ranking prototype that separates deterministic features from semantic similarity for auditable recommendations.
    title: Ranking Prototype
    skills: [Python, Machine Learning, Feature Engineering, Evaluation]
    role_families: [data_science, ai_ml]
    tags: [portfolio, ranking, evaluation]
    source_refs: [source-project-overview]
    verified: true

  - evidence_id: education-bachelors
    kind: education
    claim: Earned a bachelor's degree from Example State University.
    organization: Example State University
    title: Bachelor of Science
    role_families: [general]
    tags: [education]
    source_refs: [source-degree-record]
