[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobops"
version = "0.1.0"
description = "Evidence-grounded, human-in-the-loop job search intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
jobops-ingest = "jobops.ingestion.cli:main"
jobops-semantic-dedup = "jobops.normalization.semantic_cli:main"
jobops-build-dataset = "jobops.learning.cli:main"
jobops-flagship-daily = "jobops.flagship.schedule_cli:main"
jobops-onboard = "jobops.onboarding_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
ml = [
  "sentence-transformers>=6.0,<7",
]
browser = [
  "playwright>=1.50,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
